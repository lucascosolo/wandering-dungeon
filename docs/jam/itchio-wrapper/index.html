<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wandering Dungeon</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: monospace;
  color: #888;
  gap: 16px;
}
iframe {
  width: 100%;
  height: 100%;
  border: none;
}
.loading {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0a0a0f;
  z-index: 999;
  gap: 12px;
  transition: opacity 0.6s ease;
}
.loading--hidden { opacity: 0; pointer-events: none; }
.loading__text { color: #4af; font-size: 14px; letter-spacing: 2px; }
.loading__bar {
  width: 120px; height: 2px;
  background: #1a1a25;
  overflow: hidden;
}
.loading__bar-fill {
  width: 40%; height: 100%;
  background: #4af;
  animation: scan 1.2s ease-in-out infinite;
}
@keyframes scan {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}
.no-js {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: #0a0a0f; color: #f55; font-size: 16px;
}
</style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading__text">LOADING DUNGEON</div>
    <div class="loading__bar"><div class="loading__bar-fill"></div></div>
  </div>

  <noscript>
    <div class="no-js">JavaScript required to play The Wandering Dungeon.</div>
  </noscript>

  <iframe id="game-frame"
    title="The Wandering Dungeon"
    allow="fullscreen"
    src="https://roguelike.lucascosolo.com/">
  </iframe>

  <script>
    var frame = document.getElementById('game-frame');
    var loading = document.getElementById('loading');

    function hideLoading() {
      loading.classList.add('loading--hidden');
      setTimeout(function() { loading.style.display = 'none'; }, 700);
    }

    // Hide loading when the iframe loads
    frame.addEventListener('load', hideLoading);

    // Fallback: hide after 4 seconds regardless
    setTimeout(hideLoading, 4000);
  </script>
</body>
</html>
