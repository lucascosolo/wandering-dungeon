server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # The service worker must never be served stale. It has no content hash in its
  # name, so a long-lived cached copy would pin testers to an old worker and
  # defeat the network-first strategy the worker itself implements.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  # Same reasoning: the HTML names the hashed bundles, so a cached index.html
  # keeps pointing at last build's assets.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires off;
  }

  location = /manifest.json {
    add_header Cache-Control "no-cache";
    expires off;
  }

  # Vite fingerprints these, so the name changes whenever the bytes do and a
  # year-long cache is safe.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single page: any unknown path is the app, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
