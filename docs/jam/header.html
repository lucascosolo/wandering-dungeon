<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wandering Dungeon Header</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0f;
  width: 800px;
  height: 300px;
  overflow: hidden;
  font-family: monospace;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Grid of dungeon tiles in background */
.grid-bg {
  position: absolute;
  inset: 0;
  display: grid;
  grid-template-columns: repeat(40, 20px);
  grid-template-rows: repeat(15, 20px);
  opacity: 0.08;
}

.glyph {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: #4af;
}

/* Content */
.content {
  position: relative;
  z-index: 2;
  text-align: center;
}

.title {
  font-size: 48px;
  font-weight: bold;
  color: #e8e8f0;
  text-shadow: 0 0 30px rgba(74, 170, 255, 0.3);
  letter-spacing: 6px;
  margin-bottom: 10px;
}

.title-line {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  margin-bottom: 8px;
}

.title-line .deco {
  font-size: 24px;
  color: #4af;
}

.tagline {
  font-size: 15px;
  color: #a0a0b0;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

/* Separator */
.sep {
  width: 300px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #4af, #c99bff, #f7b32b, transparent);
  margin: 0 auto 18px;
}

/* Mini dungeon scene */
.scene {
  display: flex;
  gap: 0;
  font-size: 18px;
  line-height: 1.2;
  justify-content: center;
  opacity: 0.5;
}

.scene-line {
  color: #4af;
  letter-spacing: 2px;
}

/* Corner decorations */
.corner { position: absolute; font-size: 20px; color: #c99bff; opacity: 0.15; }
.corner-tl { top: 12px; left: 12px; }
.corner-tr { top: 12px; right: 12px; }
.corner-bl { bottom: 12px; left: 12px; }
.corner-br { bottom: 12px; right: 12px; }

/* Floating glyphs */
.float { position: absolute; font-size: 16px; opacity: 0.06; }
.float-1 { top: 15%; left: 8%; color: #f7b32b; font-size: 28px; }
.float-2 { top: 60%; left: 5%; color: #4af; font-size: 22px; }
.float-3 { top: 25%; right: 7%; color: #c99bff; font-size: 24px; }
.float-4 { top: 65%; right: 4%; color: #f7b32b; font-size: 20px; }
.float-5 { top: 40%; left: 12%; color: #e09f3e; font-size: 18px; }
.float-6 { top: 45%; right: 12%; color: #4af; font-size: 16px; }
</style>
</head>
<body>

<!-- Background grid -->
<div class="grid-bg" id="grid"></div>
<script>
  const grid = document.getElementById('grid');
  const tiles = ['.', '#', '+', '.', '.', '#', '.', '+', '.', '#'];
  const colors = ['#4af', '#c99bff', '#f7b32b'];
  for (let y = 0; y < 15; y++) {
    for (let x = 0; x < 40; x++) {
      const span = document.createElement('span');
      span.className = 'glyph';
      if (Math.random() < 0.3) {
        span.textContent = tiles[Math.floor(Math.random() * tiles.length)];
        span.style.color = colors[Math.floor(Math.random() * colors.length)];
      }
      grid.appendChild(span);
    }
  }
</script>

<!-- Floating glyphs -->
<div class="float float-1">&gt;</div>
<div class="float float-2">+</div>
<div class="float float-3">=</div>
<div class="float float-4">$</div>
<div class="float float-5">)</div>
<div class="float float-6">@</div>

<!-- Corner decorations -->
<div class="corner corner-tl">##</div>
<div class="corner corner-tr">##</div>
<div class="corner corner-bl">##</div>
<div class="corner corner-br">##</div>

<!-- Main content -->
<div class="content">
  <div class="title-line">
    <span class="deco">[</span>
    <span class="title">THE WANDERING DUNGEON</span>
    <span class="deco">]</span>
  </div>
  <div class="sep"></div>
  <div class="tagline">THE DUNGEON LITERALLY SHIFTS AROUND YOU</div>
  <div class="scene">
    <span class="scene-line">. . # + # . . @ . . # &gt; . # + . . . . #</span>
  </div>
</div>

</body>
</html>
